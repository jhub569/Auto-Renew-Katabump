name: Auto Renew Katabump

#on:  
  #schedule:
    #- cron: '17 2 * * *'  # 每天运行一次（UTC时间 02:17）
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write # 授予工作流写入仓库内容的权限
  
jobs:
  auto_renew_katabump:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Interval Check (Strict 4-day cycle)
        id: check
        run: |
          # ── 配置区 ──────────────────────────────────────────
          # 1. 设定起始日期
          START_DATE="2026-05-05"

          # 2. 设定间隔天数
          INTERVAL=4
          # ──────────────────────────────────────────────────

          export TZ='Asia/Shanghai'

          # 如果是手动触发，则直接运行
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 获取上海时间当前的日期（00:00:00 确保计算整天）
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # 转换为时间戳
          CURRENT_TS=$(date -d "$CURRENT_DATE 00:00:00" +%s)
          START_TS=$(date -d "$START_DATE 00:00:00" +%s)

          # 计算天数差
          # 用当前时间减去起始时间
          DIFF=$(( ($CURRENT_TS - $START_TS) / 86400 ))

          # 逻辑判断
          if [ $DIFF -lt 0 ]; then
            echo "Today is before the START_DATE. Skipping."
            echo "run=false" >> $GITHUB_OUTPUT
          elif [ $(( $DIFF % $INTERVAL )) -eq 0 ]; then
            echo "Matches cycle! Days since $START_DATE: $DIFF (Modulo $INTERVAL = 0)."
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "Not today. Days since $START_DATE: $DIFF. Next run in $(( $INTERVAL - ($DIFF % $INTERVAL) )) days."
            echo "run=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Checkout repository
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y xvfb
          
      - name: Get Chromium Version
        if: steps.check.outputs.run == 'true'
        id: get_version
        run: |
          CHROME_VERSION=$(chromium-browser --version 2>/dev/null | grep -oE 'Chromium\s[0-9]+' | grep -oE '[0-9]+')
          if [ -z "$CHROME_VERSION" ]; then
            CHROME_VERSION=$(google-chrome --version 2>/dev/null | grep -oE 'Chrome\s[0-9]+' | grep -oE '[0-9]+')
          fi
          if [ -z "$CHROME_VERSION" ]; then
            echo "⚠️ 无法自动检测浏览器版本，使用最新稳定版本。"
          CHROME_VERSION="144"
          fi
          echo "Detected Chrome/Chromium Major Version: $CHROME_VERSION"
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV

      - name: Start X Virtual Frame Buffer (Xvfb)
        if: steps.check.outputs.run == 'true'
        run: Xvfb :99 -ac &

      - name: Run Script in Stealth Mode (via Xvfb)
        if: steps.check.outputs.run == 'true'
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DISPLAY: ':99'
          HEADLESS: 'false'
        run: |
          python renew_katabump.py

      # --- 新增的防暂停代码开始 ---
      - name: Commit time.txt to repo
        if: steps.check.outputs.run == 'true'
        # if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi
          
          git add time.txt
          
          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
      # --- 新增的防暂停代码结束 ---
